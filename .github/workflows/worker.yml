name: Worker verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install workspace dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Worker unit and lifecycle tests
        run: npm test --workspace=@rea-studio/worker
      - name: Adapter fixture and file-boundary tests
        run: npm test --workspace=@rea-studio/rea-adapter
      - name: Upload storage and admission tests
        run: npm test --workspace=@rea-studio/pipeline
      - name: Real HTTP storage timeout and recovery checks
        run: npm run test:storage --workspace=@rea-studio/pipeline
      - name: Real Redis upload queue checks
        env:
          PIPELINE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:integration --workspace=@rea-studio/pipeline
      - name: Real Redis upload API deadline and retry checks
        env:
          PIPELINE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis-api --workspace=@rea-studio/pipeline
      # Run after the outage suites; they pause the dedicated Redis instance.
      - name: Real Redis operator pre-analysis checks
        env:
          PIPELINE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:preanalyze --workspace=@rea-studio/pipeline
      - name: Build the pinned REA image
        run: docker build -f apps/worker/Dockerfile -t rea-studio-worker:rea-6.5.0 .
      - name: Build the pinned Ghidra and JADX image
        run: docker build -f apps/worker/Dockerfile.native -t rea-studio-worker-native:rea-6.5.0 .
      - name: Real Linux queue identity and private input permissions
        run: npm run test:worker-identity
      - name: Real Docker owner crash and missing-heartbeat checks
        run: npm run test:owner --workspace=@rea-studio/worker
      - name: Real Docker Electron, program, Android and failure checks
        env:
          REA_REQUIRE_NATIVE_TESTS: '1'
        run: npm run test:docker --workspace=@rea-studio/worker
      - name: Assert no worker containers remain
        if: always()
        run: |
          remaining="$(docker ps -aq --filter label=rea-studio.worker=true)"
          if [ -n "$remaining" ]; then
            docker ps -a --filter label=rea-studio.worker=true
            exit 1
          fi
