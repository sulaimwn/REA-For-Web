name: Deploy website to Cloudflare

# Builds the Next.js site with @opennextjs/cloudflare on Linux and deploys it to
# Cloudflare Workers. Without the two secrets below it only builds, so pushes keep
# working before Cloudflare is set up. Setup: docs/deploy-cloudflare.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install workspace dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shared packages
        run: npm run build:packages
      - name: Check types and tests before deploying
        run: |
          npm run typecheck
          npm test --workspaces --if-present
      - name: Build the site for Cloudflare Workers
        run: npm run cf:build --workspace=@rea-studio/web
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built only, skipping deploy."
          fi
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
